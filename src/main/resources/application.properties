# ===================================================================
# GRINGO SEXY Platform - Application Properties
# ===================================================================
spring.application.name=gringosexy-platform

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=always

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gringosexy_db}
spring.data.mongodb.auto-index-creation=true

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Mail Configuration (SMTP Gmail / Default fallback)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# App Custom Properties
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${APP_MAIL_FROM:noreply@gringosexy.com}
app.mail.from-name=GRINGO SEXY Team

# Initial Super Admin (Seeding if not present)
app.init.superadmin.username=${SUPERADMIN_USERNAME:admin}
app.init.superadmin.email=${SUPERADMIN_EMAIL:admin@gringosexy.com}
app.init.superadmin.password=${SUPERADMIN_PASSWORD:Admin12345!}
app.init.superadmin.full-name=${SUPERADMIN_FULLNAME:Super Admin GRINGO SEXY}

# Social Links Configuration
app.social.discord=${SOCIAL_DISCORD:https://discord.gg/gringosexy}
app.social.tiktok=${SOCIAL_TIKTOK:https://tiktok.com/@gringosexy}
app.social.instagram=${SOCIAL_INSTAGRAM:https://instagram.com/gringosexy}
app.social.youtube=${SOCIAL_YOUTUBE:https://youtube.com/@gringosexy}

# Logging
logging.level.com.gringosexy=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=INFO
