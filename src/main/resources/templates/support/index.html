<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('support')}"></div>

    <div class="app-main-content">
        <div class="app-topbar">
            <div style="display:flex; align-items:center; gap:16px;">
                <button class="hamburger-btn" id="sidebarToggleBtn" aria-label="Abrir panel" style="display:inline-block;">
                    <i class="fas fa-bars"></i>
                </button>
                <div>
                    <h2 style="font-size:1.3rem; font-weight:800;">Soporte Técnico</h2>
                    <p style="font-size:0.82rem; color:var(--text-dim);">Asistencia y resolución de dudas sobre configuraciones</p>
                </div>
            </div>
        </div>

        <div class="app-page-body">
            <div style="display:grid; grid-template-columns: 1fr 1.2fr; gap:32px;">
                <!-- New Ticket Form -->
                <div class="glass-card">
                    <h3 style="font-size:1.2rem; margin-bottom:16px;">
                        <i class="fas fa-plus-circle" style="color:var(--primary); margin-right:6px;"></i> Crear Nueva Solicitud
                    </h3>

                    <form th:action="@{/support}" method="post">
                        <div class="form-group">
                            <label class="form-label" for="subject">Asunto</label>
                            <input type="text" id="subject" name="subject" class="form-control" placeholder="ej. Duda sobre calibración de DPI en Galaxy S23" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="message">Mensaje o Detalle del Problema</label>
                            <textarea id="message" name="message" class="form-control" rows="5" placeholder="Explica detalladamente qué problema experimentas o qué ajuste requieres..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-paper-plane"></i> Enviar Solicitud a Soporte
                        </button>
                    </form>
                </div>

                <!-- My Tickets History -->
                <div>
                    <h3 style="font-size:1.2rem; margin-bottom:16px;">
                        <i class="fas fa-history" style="color:var(--accent-cyan); margin-right:6px;"></i> Mis Solicitudes Anteriores
                    </h3>

                    <div th:if="${tickets.empty}" class="glass-card" style="text-align:center; padding:40px 20px;">
                        <i class="fas fa-inbox" style="font-size:2.5rem; color:var(--text-dim); margin-bottom:12px;"></i>
                        <p style="color:var(--text-muted); font-size:0.95rem;">No tienes ningún ticket de soporte activo.</p>
                    </div>

                    <div th:unless="${tickets.empty}">
                        <div th:each="t : ${tickets}" class="glass-card" style="margin-bottom:16px; padding:20px;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                                <h4 style="font-size:1rem; font-weight:700;" th:text="${t.subject}">Asunto</h4>
                                <span class="badge" th:classappend="${t.status.badgeClass}" th:text="${t.status.displayName}">Abierto</span>
                            </div>
                            <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:12px;" th:text="${t.message}">Mensaje</p>

                            <!-- Admin Response if exists -->
                            <div th:if="${t.adminResponse != null}" style="background:rgba(6, 182, 212, 0.1); border-left:3px solid var(--accent-cyan); padding:12px 14px; border-radius:var(--radius-sm); margin-top:10px;">
                                <div style="font-size:0.75rem; font-weight:700; color:var(--accent-cyan); margin-bottom:4px; text-transform:uppercase;">Respuesta de GRINGO SEXY Support:</div>
                                <div style="font-size:0.88rem; color:#e2e8f0;" th:text="${t.adminResponse}">Respuesta</div>
                            </div>

                            <div style="font-size:0.75rem; color:var(--text-dim); margin-top:10px;">
                                Creado el <span th:text="${#temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: alerts}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

</body>
</html>
