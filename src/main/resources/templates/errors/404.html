<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Página No Encontrada (404) — GRINGO SEXY')}"></head>
<body>

<div class="ambient-glow"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-wrapper">
    <div class="auth-card" style="text-align: center; max-width: 500px;">
        <div style="font-size: 5rem; font-weight: 900; color: var(--accent-cyan); line-height: 1; margin-bottom: 12px; text-shadow: 0 0 30px rgba(6,182,212,0.4);">
            404
        </div>

        <h2 class="auth-title" th:text="${errorTitle != null ? errorTitle : 'Página No Encontrada'}">Página No Encontrada</h2>
        
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;" th:text="${errorMessage != null ? errorMessage : 'La dirección web a la que intentas acceder no existe, ha sido eliminada o movida a otra ruta.'}">
            La página solicitada no existe.
        </p>

        <a th:href="@{/}" class="btn btn-primary">
            <i class="fas fa-home"></i> Regresar al Inicio
        </a>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

</body>
</html>
