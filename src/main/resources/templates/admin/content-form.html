<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: admin-sidebar('admin-content')}"></div>

    <div class="app-main-content">
        <div class="app-topbar">
            <div style="display:flex; align-items:center; gap:16px;">
                <a th:href="@{/admin/content}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver a Videos</a>
                <div>
                    <h2 style="font-size:1.3rem; font-weight:800; color:var(--text-main);" th:text="${isNew ? 'Crear Nuevo Video / Contenido' : 'Editar Video / Contenido'}">Editor</h2>
                    <p style="font-size:0.85rem; color:var(--text-muted);">Redacta instrucciones técnicas, sube videos y asigna compatibilidad por marca</p>
                </div>
            </div>
        </div>

        <div class="app-page-body" style="max-width: 920px;">
            <div class="glass-card">
                <form th:action="${isNew ? '/admin/content/new' : '/admin/content/' + contentId + '/edit'}" th:object="${contentRequest}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="title">Título del Video o Contenido</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="ej. CONFIG & SENSI ALTA COMPLETA - IPHONE v4 (PRO)" required>
                        <div class="form-text-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                        <div class="form-group">
                            <label class="form-label" for="category">Categoría del Módulo</label>
                            <select id="category" th:field="*{category}" class="form-select" required>
                                <option th:each="cat : ${categories}" th:value="${cat.code}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="slug">Slug URL (Opcional - se autogenera si está vacío)</label>
                            <input type="text" id="slug" th:field="*{slug}" class="form-control" placeholder="sensibilidad-iphone-16-pro">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="summary">Resumen Breve (Aparece en la tarjeta del catálogo)</label>
                        <textarea id="summary" th:field="*{summary}" class="form-control" rows="2" placeholder="Resumen conciso del video y beneficios de calibración..." required></textarea>
                        <div class="form-text-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="videoUrl">
                            <i class="fas fa-video" style="color:var(--primary);"></i> Archivo o Enlace del Video (Opcional)
                        </label>
                        <input type="text" id="videoUrl" th:field="*{videoUrl}" class="form-control" placeholder="ej. /videos/iphone-confi-sensi-baja-v1.mp4 o https://www.youtube.com/watch?v=...">
                        <small style="color:var(--text-muted); font-size:0.8rem; display:block; margin-top:4px;">
                            Puedes colocar una ruta local en <code>/videos/nombre-archivo.mp4</code> o un enlace de YouTube / CDN.
                        </small>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="body">Instrucciones & Pasos Detallados</label>
                        <textarea id="body" th:field="*{body}" class="form-control" rows="8" placeholder="Escribe aquí los pasos detallados, valores de DPI, velocidad de puntero, configuraciones en el juego..." required></textarea>
                        <div class="form-text-error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></div>
                    </div>

                    <!-- Target Devices -->
                    <div class="form-group" style="background:var(--bg-surface-warm); padding:22px; border-radius:var(--radius-md); border:1px solid var(--border-subtle);">
                        <label class="form-label" style="margin-bottom:8px;">Dispositivos de Destino / Marcas Compatibles</label>
                        
                        <div style="margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border-subtle);">
                            <label class="checkbox-label" style="font-weight:700; color:var(--text-main);">
                                <input type="checkbox" th:field="*{applyToAllDevices}" id="allDevicesCheck">
                                <span>Habilitar para TODOS los dispositivos (Universal)</span>
                            </label>
                        </div>

                        <div id="targetDevicesGroup" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:12px; margin-top:10px;">
                            <div th:each="dev : ${devices}">
                                <label class="checkbox-label" style="font-size:0.88rem;">
                                    <input type="checkbox" th:field="*{targetDevices}" th:value="${dev.type}" class="device-target-checkbox">
                                    <span th:text="${dev.name}">iPhone</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Options -->
                    <div style="display:flex; gap:24px; margin:20px 0; flex-wrap:wrap;">
                        <label class="checkbox-label">
                            <input type="checkbox" th:field="*{active}">
                            <span>Publicación Activa (Visible para usuarios)</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" th:field="*{featured}">
                            <span>Destacar Contenido</span>
                        </label>
                    </div>

                    <div style="display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> Guardar y Publicar
                        </button>
                        <a th:href="@{/admin/content}" class="btn btn-secondary btn-lg">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: alerts}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const allDevicesCheck = document.getElementById('allDevicesCheck');
        const deviceBoxes = document.querySelectorAll('.device-target-checkbox');

        function updateDeviceCheckboxes() {
            if (allDevicesCheck.checked) {
                deviceBoxes.forEach(b => {
                    b.disabled = true;
                    b.closest('label').style.opacity = '0.5';
                });
            } else {
                deviceBoxes.forEach(b => {
                    b.disabled = false;
                    b.closest('label').style.opacity = '1';
                });
            }
        }

        if (allDevicesCheck) {
            allDevicesCheck.addEventListener('change', updateDeviceCheckboxes);
            updateDeviceCheckboxes();
        }
    });
</script>

</body>
</html>
