<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Restablecer Contraseña — GRINGO SEXY')}"></head>
<body>

<div class="ambient-glow"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 460px;">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-lock"></i>
                <span>GRINGO <span class="text-gradient">SEXY</span></span>
            </div>
            <h2 class="auth-title">Nueva Contraseña</h2>
            <p class="auth-subtitle">Crea una nueva clave de acceso para tu cuenta</p>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label class="form-label" for="password">Nueva Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repite tu nueva contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
                <i class="fas fa-save"></i> Guardar Nueva Contraseña
            </button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

</body>
</html>
