<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recuperar Contraseña — GRINGO SEXY')}"></head>
<body>

<div class="ambient-glow"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="auth-wrapper">
    <!-- Top Branding matching screenshot -->
    <div style="text-align: center; margin-bottom: 22px;">
        <div style="color: #ff5500; font-size: 1.6rem; margin-bottom: 2px;">
            <i class="fas fa-crown"></i>
        </div>
        <div class="auth-brand-badge">
            <i class="fas fa-fire-alt"></i>
            <span>GRINGO <span style="color: var(--primary);">SEXY</span></span>
        </div>
        <div class="auth-tagline">TU COMUNIDAD, TU ESTILO</div>
    </div>

    <div class="auth-card" style="max-width: 460px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255,85,0,0.12); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 12px; border: 1px solid rgba(255,85,0,0.3);">
                <i class="fas fa-key"></i>
            </div>
            <h2 class="auth-title">Recuperar Contraseña</h2>
            <p class="auth-subtitle">Ingresa tu correo registrado y te enviaremos un enlace seguro para restablecerla</p>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label class="form-label" for="email">Correo Electrónico</label>
                <div class="input-icon-wrap">
                    <i class="far fa-envelope input-icon-left"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-auth-submit" style="margin-top:20px;">
                <i class="fas fa-paper-plane"></i>
                <span>Enviar Enlace de Recuperación</span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 22px; font-size: 0.9rem; color: #94a3b8;">
            ¿Recordaste tu contraseña? <a th:href="@{/login}" style="color: var(--primary); font-weight: 700;">Volver al inicio de sesión</a>
        </div>
    </div>

    <!-- Bottom aesthetic footer brand -->
    <div class="auth-bottom-brand">
        <i class="fas fa-crown"></i>
        <div>GRINGO SEXY</div>
        <div style="font-size:0.68rem; color:#64748b; margin-top:2px;">MÁS QUE UNA COMUNIDAD</div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

</body>
</html>
