<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recuperar Contraseña — GRINGO SEXY')}"></head>
<body>

<div class="ambient-glow"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 460px;">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-key"></i>
                <span>GRINGO <span class="text-gradient">SEXY</span></span>
            </div>
            <h2 class="auth-title">Recuperar Contraseña</h2>
            <p class="auth-subtitle">Ingresa tu correo registrado y te enviaremos un enlace seguro para restablecerla</p>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label class="form-label" for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="tu@email.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
                <i class="fas fa-paper-plane"></i> Enviar Enlace
            </button>
        </form>

        <div class="auth-footer">
            ¿Recordaste tu clave? <a th:href="@{/login}">Volver al login</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

</body>
</html>
