<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar Sesión — GRINGO SEXY')}"></head>
<body>

<div class="ambient-glow"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="auth-wrapper">
    <!-- Top Branding matching screenshot -->
    <div style="text-align: center; margin-bottom: 22px;">
        <div style="color: #ff5500; font-size: 1.6rem; margin-bottom: 2px;">
            <i class="fas fa-crown"></i>
        </div>
        <div class="auth-brand-badge">
            <i class="fas fa-fire-alt"></i>
            <span>GRINGO <span style="color: var(--primary);">SEXY</span></span>
        </div>
        <div class="auth-tagline">TU COMUNIDAD, TU ESTILO</div>
    </div>

    <div class="auth-card">
        <!-- Dual Tab Switcher -->
        <div class="auth-tab-group">
            <a th:href="@{/login}" class="auth-tab-item active">
                <i class="fas fa-user"></i> Iniciar sesión
            </a>
            <a th:href="@{/register}" class="auth-tab-item">
                <i class="fas fa-user-plus"></i> Crear cuenta
            </a>
        </div>

        <!-- Dynamic Loading Feedback Box -->
        <div id="loginLoadingBox" style="display:none; align-items:center; gap:12px; background: rgba(255,85,0,0.12); border: 1px solid rgba(255,85,0,0.35); padding: 14px 16px; border-radius: 14px; margin-bottom: 20px;">
            <i class="fas fa-circle-notch fa-spin" style="font-size:1.3rem; color:var(--primary);"></i>
            <div>
                <div style="font-size:0.88rem; font-weight:800; color:#ffffff;">Iniciando sesión...</div>
                <div style="font-size:0.78rem; color:#94a3b8;">Validando credenciales y conectando con el servidor</div>
            </div>
        </div>

        <form th:action="@{/login}" method="post" id="loginForm">
            <!-- Email / Username input with left envelope icon -->
            <div class="form-group" style="margin-bottom: 16px;">
                <div class="input-icon-wrap">
                    <i class="far fa-envelope input-icon-left"></i>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Correo electrónico o usuario" required autofocus>
                </div>
            </div>

            <!-- Password input with left lock icon and right eye toggle -->
            <div class="form-group" style="margin-bottom: 16px;">
                <div class="input-icon-wrap">
                    <i class="fas fa-lock input-icon-left"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required>
                    <button type="button" class="input-icon-right" id="togglePasswordBtn" aria-label="Mostrar u ocultar contraseña">
                        <i class="far fa-eye" id="passwordEyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember-me" id="rememberMe">
                    <span>Recordarme</span>
                </label>
                <a th:href="@{/forgot-password}" class="auth-forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-auth-submit" id="submitLoginBtn">
                <span id="btnIcon"><i class="fas fa-arrow-right"></i></span>
                <span id="btnText">Iniciar sesión</span>
            </button>
        </form>

        <!-- Social login / Direct access divider -->
        <div class="social-divider">
            <span>O entra con</span>
        </div>

        <!-- Social 3-column items: Instagram, TikTok, YouTube -->
        <div class="social-grid-row">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="social-square-card ig">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="social-square-card tt">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="social-square-card yt">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
        </div>

        <!-- Social full width pill buttons with arrows -->
        <a th:href="@{/pending-activation}" class="social-full-pill whatsapp">
            <div class="pill-left">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </div>
            <i class="fas fa-arrow-right arrow-icon"></i>
        </a>

        <a href="https://discord.gg" target="_blank" rel="noopener noreferrer" class="social-full-pill discord">
            <div class="pill-left">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
            </div>
            <i class="fas fa-arrow-right arrow-icon"></i>
        </a>
    </div>

    <!-- Bottom aesthetic footer brand -->
    <div class="auth-bottom-brand">
        <i class="fas fa-crown"></i>
        <div>GRINGO SEXY</div>
        <div style="font-size:0.68rem; color:#64748b; margin-top:2px;">MÁS QUE UNA COMUNIDAD</div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitLoginBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const loadingBox = document.getElementById('loginLoadingBox');
        
        // Password toggle visibility
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const passwordEyeIcon = document.getElementById('passwordEyeIcon');

        if (togglePasswordBtn && passwordInput && passwordEyeIcon) {
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                passwordEyeIcon.className = isPassword ? 'far fa-eye-slash' : 'far fa-eye';
            });
        }

        if (loginForm && submitBtn) {
            loginForm.addEventListener('submit', (e) => {
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.9';
                submitBtn.style.cursor = 'wait';
                
                if (btnIcon) {
                    btnIcon.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
                }
                if (btnText) {
                    btnText.textContent = 'Iniciando sesión...';
                }
                if (loadingBox) {
                    loadingBox.style.display = 'flex';
                }
            });
        }
    });
</script>

</body>
</html>
