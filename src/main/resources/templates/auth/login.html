<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar Sesión — GRINGO SEXY')}"></head>
<body>

<div class="ambient-glow"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/navbar :: alerts}"></div>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-fire-alt"></i>
                <span>GRINGO <span class="text-gradient">SEXY</span></span>
            </div>
            <h2 class="auth-title">Bienvenido de Vuelta</h2>
            <p class="auth-subtitle">Ingresa tus credenciales para acceder a tus configuraciones</p>
        </div>

        <!-- Dynamic Loading Feedback Box -->
        <div id="loginLoadingBox" style="display:none; align-items:center; gap:12px; background: rgba(242,85,56,0.1); border: 1px solid rgba(242,85,56,0.3); padding: 14px 16px; border-radius: var(--radius-md); margin-bottom: 20px; animation: pulseGlow 1.5s infinite;">
            <i class="fas fa-circle-notch fa-spin" style="font-size:1.3rem; color:var(--primary);"></i>
            <div>
                <div style="font-size:0.88rem; font-weight:800; color:var(--text-main);">Iniciando sesión...</div>
                <div style="font-size:0.78rem; color:var(--text-secondary);">Validando credenciales y conectando con el servidor</div>
            </div>
        </div>

        <form th:action="@{/login}" method="post" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fas fa-user" style="color:var(--text-dim); margin-right:4px;"></i> Correo Electrónico o Usuario
                </label>
                <input type="text" id="username" name="username" class="form-control" placeholder="ej. gringo@gmail.com o gringo2026" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock" style="color:var(--text-dim); margin-right:4px;"></i> Contraseña
                </label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="auth-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember-me" id="rememberMe">
                    <span>Recordarme</span>
                </label>
                <a th:href="@{/forgot-password}" style="color:var(--text-muted); font-size:0.85rem;">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitLoginBtn">
                <span id="btnIcon"><i class="fas fa-sign-in-alt"></i></span>
                <span id="btnText">Iniciar Sesión</span>
            </button>
        </form>

        <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-subtle); text-align: center;">
            <a th:href="@{/pending-activation}" style="color: #25d366; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fab fa-whatsapp"></i> ¿Pendiente de activación o pago? Contactar por WhatsApp
            </a>
        </div>

        <div class="auth-footer" style="margin-top: 14px;">
            ¿Aún no tienes una cuenta? <a th:href="@{/register}">Regístrate aquí</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
<div th:replace="~{fragments/navbar :: scripts}"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitLoginBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const loadingBox = document.getElementById('loginLoadingBox');

        if (loginForm && submitBtn) {
            loginForm.addEventListener('submit', (e) => {
                // Visual feedback immediately
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.9';
                submitBtn.style.cursor = 'wait';
                
                if (btnIcon) {
                    btnIcon.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
                }
                if (btnText) {
                    btnText.textContent = 'Iniciando sesión... Espera un momento';
                }
                if (loadingBox) {
                    loadingBox.style.display = 'flex';
                }
            });
        }
    });
</script>

</body>
</html>
